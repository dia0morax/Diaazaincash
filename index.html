<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المطور - إدارة اشتراكات المنافذ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0066FF;
            --success: #05CD99;
            --danger: #EE5D50;
            --warning: #FF9900;
            --bg: #0B1437;
            --card: #111C44;
            --border: #2B3674;
            --text: #FFFFFF;
            --text-sec: #A3AED0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.5rem; color: var(--primary); }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card h3 { margin-bottom: 15px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--text); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-sec); margin-bottom: 5px; font-weight: 700; }
        .form-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 700; outline: none; }
        
        .quick-durations { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .dur-btn { padding: 7px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-sec); cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s; }
        .dur-btn:hover, .dur-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .btn-create { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 10px; color: #fff; font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-create:hover { opacity: 0.9; }

        /* جدول الحسابات */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { color: var(--text-sec); font-weight: 700; background: rgba(0,0,0,0.1); }
        
        tr.user-row { cursor: pointer; transition: 0.2s; }
        tr.user-row:hover { background: rgba(0, 102, 255, 0.08); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
        .badge-active { background: rgba(5, 205, 153, 0.15); color: var(--success); }
        .badge-expired { background: rgba(238, 93, 80, 0.2); color: var(--danger); font-weight: 900; }
        
        .action-btns { display: flex; gap: 6px; }
        .sm-btn { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 700; }
        .btn-reset-dev { background: rgba(255, 153, 0, 0.15); color: var(--warning); }
        .btn-del { background: rgba(238, 93, 80, 0.15); color: var(--danger); }

        /* نافذة تفاصيل وتمديد الحساب المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .close-btn { font-size: 1.5rem; cursor: pointer; color: var(--text-sec); }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1><i class="fa-solid fa-user-shield"></i> لوحة تحكم المشتركين</h1>
            <span style="font-size: 0.85rem; color: var(--text-sec);">المطور: diajb0@</span>
        </header>

        <div class="card">
            <h3><i class="fa-solid fa-user-plus" style="color: var(--primary);"></i> إنشاء أو تمديد حساب منفذ</h3>
            <form id="createAccountForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>اسم المستخدم (English / أرقام):</label>
                        <input type="text" id="newUsername" required placeholder="مثال: manfath1">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور:</label>
                        <input type="text" id="newPassword" required placeholder="مثال: 12345678">
                    </div>
                    <div class="form-group">
                        <label>تاريخ ووقت الانتهاء:</label>
                        <input type="datetime-local" id="expiryDateInput" required>
                    </div>
                </div>

                <div class="quick-durations">
                    <span style="font-size: 0.8rem; color: var(--text-sec); margin-left: 5px; align-self: center;">خيارات سريعة:</span>
                    <button type="button" class="dur-btn" onclick="setQuickTime(5, 'minutes')">5 دقائق (تجربة)</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(1, 'hours')">ساعة واحدة</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(1, 'days')">يوم واحد</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(7, 'days')">أسبوع (7 أيام)</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(30, 'days')">شهر (30 يوم)</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(365, 'days')">سنة</button>
                    <button type="button" class="dur-btn" onclick="setQuickTime(29000, 'days')">مدى الحياة</button>
                </div>

                <button type="submit" class="btn-create" id="submitAccBtn">
                    حفظ وتفعيل الحساب <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-users" style="color: var(--success);"></i> المشتركين (اضغط على أي صف لتفاصيل وتمديد الحساب)</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>اسم المستخدم</th>
                            <th>كلمة المرور</th>
                            <th>تاريخ الانتهاء</th>
                            <th>الحالة</th>
                            <th>الأجهزة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="subscriptionsTableBody">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-sec);">جاري جلب الحسابات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalUsernameTitle"><i class="fa-solid fa-user-gear"></i> تفاصيل الحساب</h3>
                <span class="close-btn" onclick="document.getElementById('detailsModal').style.display='none'">&times;</span>
            </div>
            <div style="margin-bottom: 15px;">
                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="modalUsernameDisplay" readonly style="background: rgba(0,0,0,0.2); cursor: not-allowed; color: var(--primary);">
                </div>

                <div class="form-group">
                    <label>كلمة المرور (يمكنك تعديلها أيضاً):</label>
                    <input type="text" id="modalPasswordInput" placeholder="كلمة المرور">
                </div>

                <div class="form-group">
                    <label>تعديل / تمديد تاريخ ووقت الانتهاء:</label>
                    <input type="datetime-local" id="extendExpiryInput">
                </div>
                
                <div class="quick-durations">
                    <button type="button" class="dur-btn" onclick="setExtendTime(5, 'minutes')">+5 دقائق</button>
                    <button type="button" class="dur-btn" onclick="setExtendTime(1, 'hours')">+ساعة</button>
                    <button type="button" class="dur-btn" onclick="setExtendTime(7, 'days')">+أسبوع</button>
                    <button type="button" class="dur-btn" onclick="setExtendTime(30, 'days')">+شهر</button>
                    <button type="button" class="dur-btn" onclick="setExtendTime(365, 'days')">+سنة</button>
                </div>
            </div>
            <button id="saveExtensionBtn" class="btn-create" style="margin-bottom: 10px;">حفظ التعديلات والتمديد</button>
            
            <button id="copyMessageBtn" type="button" class="btn-create" style="background: var(--success); margin-bottom: 10px;">
                <i class="fa-solid fa-copy"></i> نسخ كليشة الإرسال للزبون
            </button>

            <button id="modalResetDevBtn" class="btn-create btn-reset-dev" style="background: rgba(255, 153, 0, 0.15); border: 1px solid var(--warning);">
                <i class="fa-solid fa-rotate-left"></i> تصفير الأجهزة وطرد المتصلين فوراً
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtGr3r2MS8a7KdVuBh8gJVL0eNve7twSU",
            authDomain: "zaincashdeliveryhelper.firebaseapp.com",
            projectId: "zaincashdeliveryhelper",
            storageBucket: "zaincashdeliveryhelper.firebasestorage.app",
            messagingSenderId: "108290396776",
            appId: "1:108290396776:web:ae3a55b268aaaf84c1e1dd"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // تحويل التاريخ إلى صيغة datetime-local
        function formatDateTimeLocal(date) {
            const pad = (n) => n < 10 ? '0' + n : n;
            return date.getFullYear() + '-' +
                pad(date.getMonth() + 1) + '-' +
                pad(date.getDate()) + 'T' +
                pad(date.getHours()) + ':' +
                pad(date.getMinutes());
        }

        function setQuickTime(amount, unit) {
            const d = new Date();
            if (unit === 'minutes') d.setMinutes(d.getMinutes() + amount);
            if (unit === 'hours') d.setHours(d.getHours() + amount);
            if (unit === 'days') d.setDate(d.getDate() + amount);
            document.getElementById('expiryDateInput').value = formatDateTimeLocal(d);
        }

        setQuickTime(7, 'days');

        let selectedUserDoc = null;

        function setExtendTime(amount, unit) {
            const d = new Date();
            if (unit === 'minutes') d.setMinutes(d.getMinutes() + amount);
            if (unit === 'hours') d.setHours(d.getHours() + amount);
            if (unit === 'days') d.setDate(d.getDate() + amount);
            document.getElementById('extendExpiryInput').value = formatDateTimeLocal(d);
        }

        // جلب المشتركين
        function loadSubscriptions() {
            db.collection("subscriptions").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const tbody = document.getElementById('subscriptionsTableBody');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-sec);">لا توجد حسابات مسجلة.</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const username = doc.id;
                    const now = new Date().getTime();
                    const expiryTime = new Date(data.expiryDate).getTime();
                    const isExpired = now > expiryTime;
                    const devicesCount = (data.devices || []).length;

                    const tr = document.createElement('tr');
                    tr.className = 'user-row';
                    tr.innerHTML = `
                        <td><strong>${username}</strong></td>
                        <td style="color: var(--text-sec); font-family: monospace;">${data.password || '---'}</td>
                        <td>${new Date(data.expiryDate).toLocaleString('ar-EG')}</td>
                        <td>
                            <span class="badge ${isExpired ? 'badge-expired' : 'badge-active'}">
                                ${isExpired ? 'غير فعال (منتهي)' : 'فعال'}
                            </span>
                        </td>
                        <td><i class="fa-solid fa-mobile-screen"></i> ${devicesCount} / 4</td>
                        <td>
                            <div class="action-btns" onclick="event.stopPropagation()">
                                <button class="sm-btn btn-reset-dev" title="تصفير وطرد الأجهزة فوراً" onclick="resetDevices('${username}')">
                                    <i class="fa-solid fa-rotate-left"></i> تصفير وطرد
                                </button>
                                <button class="sm-btn btn-del" title="حذف" onclick="deleteAccount('${username}')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;

                    tr.onclick = () => openUserDetails(username, data);
                    tbody.appendChild(tr);
                });
            });
        }

        loadSubscriptions();

        // فتح نافذة تفاصيل وتمديد الحساب وتجهيز زر الكليشة
        function openUserDetails(username, data) {
            selectedUserDoc = username;
            document.getElementById('modalUsernameTitle').innerHTML = `<i class="fa-solid fa-user-gear"></i> إدارة الحساب: ${username}`;
            document.getElementById('modalUsernameDisplay').value = username;
            document.getElementById('modalPasswordInput').value = data.password || '';
            
            const expDate = new Date(data.expiryDate);
            document.getElementById('extendExpiryInput').value = formatDateTimeLocal(expDate);
            
            document.getElementById('modalResetDevBtn').onclick = () => resetDevices(username);

            // برمجة زر نسخ الكليشة التلقائية الذكية
            document.getElementById('copyMessageBtn').onclick = () => {
                const currentPass = document.getElementById('modalPasswordInput').value.trim() || data.password;
                const targetExp = new Date(document.getElementById('extendExpiryInput').value || data.expiryDate);
                const now = new Date();
                const diffDays = Math.round((targetExp - now) / (1000 * 60 * 60 * 24));
                const formattedDate = targetExp.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });

                // تحديد نوع الباقة تلقائياً
                let pkgName = "التجريبية المجانية (7 أيام)";
                let headIntro = "أهلاً بك! تم تفعيل حسابك التجريبي بنجاح في منظومة مساعد إيداع السواق 🚀";
                
                if (diffDays > 3000) {
                    pkgName = "اشتراك مدى الحياة (مفتوح للأبد)";
                    headIntro = "ألف مبروك! تم تفعيل اشتراكك الدائم (مدى الحياة) في منظومة مساعد إيداع السواق 👑";
                } else if (diffDays > 300) {
                    pkgName = "الاشتراك السنوي (خصم 60%)";
                    headIntro = "أهلاً بك! تم تفعيل اشتراكك السنوي بنجاح في منظومة مساعد إيداع السواق 🌟";
                } else if (diffDays > 20) {
                    pkgName = "الاشتراك الشهري";
                    headIntro = "أهلاً بك! تم تفعيل اشتراكك الشهري بنجاح في منظومة مساعد إيداع السواق ⚡";
                }

                // نص الكليشة الجذاب
                const clientMessage = 
`${headIntro}

✨ نوع الباقة: ${pkgName}
⏳ تاريخ نهاية الصلاحية: ${formattedDate}

🔐 بيانات تسجيل الدخول الخاصة بمنفذك:
👤 اسم المستخدم: ${username}
🔑 كلمة المرور: ${currentPass}

💡 ميزات المنظومة المتوفرة لك:
✅ قاعدة بيانات ضخمة ومحدثة لسواق طلبات وبلي فود.
✅ نسخ فوري بكبسة زر واحدة لمنع الزخم.
✅ حماية كاملة من أخطاء التحويل وفحص ذكي للـ ID ورقم الهاتف.
✅ إمكانية فتح الحساب على 4 أجهزة لمنفذك.

💰 باقات وعروض الاشتراك:
🎁 الباقة التجريبية: 7 أيام مجاناً
🔹 الاشتراك الشهري: 10,000 دينار فقط
🔥 الاشتراك السنوي: 48,000 دينار (خصم 60% - الشهر بـ 4 آلاف فقط)
👑 اشتراك مدى الحياة: 100,000 دينار (شراء لمرة واحدة)

📞 للدعم الفني والتجديد:
💬 تليجرام: @diajb0
📱 هاتف: 07862247686`;

                navigator.clipboard.writeText(clientMessage).then(() => {
                    const btn = document.getElementById('copyMessageBtn');
                    const origText = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> تم نسخ الكليشة بنجاح!';
                    btn.style.background = '#0052CC';
                    setTimeout(() => {
                        btn.innerHTML = origText;
                        btn.style.background = 'var(--success)';
                    }, 2000);
                });
            };

            document.getElementById('detailsModal').style.display = 'flex';
        }

        // حفظ التمديد وتعديل الباسورد من النافذة
        document.getElementById('saveExtensionBtn').onclick = async () => {
            if (!selectedUserDoc) return;
            const newExp = document.getElementById('extendExpiryInput').value;
            const newPass = document.getElementById('modalPasswordInput').value.trim();

            if (!newPass) {
                alert("لا يمكن ترك كلمة المرور فارغة!");
                return;
            }

            try {
                await db.collection("subscriptions").doc(selectedUserDoc).update({
                    password: newPass,
                    expiryDate: new Date(newExp).toISOString()
                });
                alert("تم تحديث بيانات الحساب والتمديد بنجاح!");
                document.getElementById('detailsModal').style.display = 'none';
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        };

        // تصفير الأجهزة وطرد المتصلين فوراً
        async function resetDevices(username) {
            if (confirm(`هل تريد تصفير الأجهزة وطرد كل المتصلين حالياً من الحساب (${username})؟`)) {
                const newSessionKey = 'sess_' + Math.random().toString(36).substr(2, 9) + Date.now();
                await db.collection("subscriptions").doc(username).update({
                    devices: [],
                    sessionKey: newSessionKey
                });
                alert("تم تصفير الأجهزة وطرد جميع الجلسات المتصلة بنجاح!");
            }
        }

        // حذف الحساب
        async function deleteAccount(username) {
            if (confirm(`هل أنت متأكد من رغبتك في حذف الحساب (${username}) نهائياً؟`)) {
                await db.collection("subscriptions").doc(username).delete();
            }
        }

        // إنشاء / تفعيل حساب جديد
        document.getElementById('createAccountForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim().toLowerCase();
            const password = document.getElementById('newPassword').value.trim();
            const expiryDateLocal = document.getElementById('expiryDateInput').value;
            const submitBtn = document.getElementById('submitAccBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'جاري الحفظ والإنشاء...';

            try {
                const expiryISO = new Date(expiryDateLocal).toISOString();
                const sessionKey = 'sess_' + Math.random().toString(36).substr(2, 9) + Date.now();

                await db.collection("subscriptions").doc(username).set({
                    password: password,
                    expiryDate: expiryISO,
                    devices: [],
                    sessionKey: sessionKey,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                alert(`✅ تم حفظ وتفعيل الحساب بنجاح!\n\nاسم المستخدم: ${username}\nكلمة المرور: ${password}\nينتهي في: ${new Date(expiryISO).toLocaleString('ar-EG')}`);
                document.getElementById('createAccountForm').reset();
                setQuickTime(7, 'days');
            } catch (err) {
                alert("خطأ أثناء الحفظ: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'حفظ وتفعيل الحساب <i class="fa-solid fa-check"></i>';
            }
        };

    </script>
</body>
</html>
